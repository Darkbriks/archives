<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TP3</title>
    <link rel="stylesheet" href="style.css">
    <script src="blagues.js"></script>
</head>
<body>
    <!-- Zone de saisie et bouton de recherche -->
    <div id="form">
        <input id="form-text" type="text" name="search" placeholder="Mots clés...">
        <input id="form-submit" type="submit" value="Chercher des blagues">
    </div>

    <!-- Zone d'affichage du nombre de pages, et selection de la page -->
    <div id="pages">
        <input id="pages-number-prev" type="button" value="prev">
        <p id="pages-number">1 / 149</p>
        <input id="pages-number-next" type="button" value="next">
    </div>

    <!-- Zone d'affichage des blagues -->
    <div id="blagues">

    </div>

    <!-- Zone d'affichage du(des) tag(s) -->
    <div id="tags">
        <p id="tags-text">Mots clés :</p>
        <p id="tags-list"></p>
    </div>
</body>
</html>
